[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "minlith-modern"
version = "0.4.0"
description = "Normative mineralogical calculation from rock chemical composition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["geochemistry", "mineralogy", "normative", "CIPW", "rock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Geochemistry",
]
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "reportlab>=4.1",
    "python-docx>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "mypy>=1.8",
    "ruff>=0.2",
]

[project.scripts]
minlith = "src.cli:main_cli"
minlith-gui = "src.main:main"

[project.urls]
Homepage = "https://github.com/user/minlith-modern"
Repository = "https://github.com/user/minlith-modern"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
